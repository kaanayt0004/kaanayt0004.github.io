        // Typewriter Component for animated text with fading next letter and blinking cursor
        const Typewriter = ({ text, delay, infinite }) => {
          const [currentDisplay, setCurrentDisplay] = useState('');
          const [currentIndex, setCurrentIndex] = useState(0);
          const [isDeleting, setIsDeleting] = useState(false);
          const [loopNum, setLoopNum] = useState(0);
          const [showCursor, setShowCursor] = useState(true);

          const fullText = text[loopNum % text.length];

          useEffect(() => {
            let typingTimeout;
            const handleTyping = () => {
              if (!isDeleting) {
                if (currentIndex < fullText.length) {
                  setCurrentDisplay(fullText.substring(0, currentIndex + 1));
                  setCurrentIndex(prev => prev + 1);
                  typingTimeout = setTimeout(handleTyping, delay);
                } else {
                  if (!infinite) {
                    setShowCursor(false);
                    return;
                  }
                  typingTimeout = setTimeout(() => setIsDeleting(true), 1500);
                }
              } else {
                if (currentIndex > 0) {
                  setCurrentDisplay(fullText.substring(0, currentIndex - 1));
                  setCurrentIndex(prev => prev - 1);
                  typingTimeout = setTimeout(handleTyping, delay / 2);
                } else {
                  setIsDeleting(false);
                  setLoopNum(prev => prev + 1);
                  typingTimeout = setTimeout(handleTyping, 500);
                }
              }
            };
            typingTimeout = setTimeout(handleTyping, delay);
            return () => clearTimeout(typingTimeout);
          }, [currentIndex, isDeleting, loopNum, text, delay, infinite, fullText]);

          useEffect(() => {
            const cursorInterval = setInterval(() => {
              setShowCursor(prev => !prev);
            }, 500);
            return () => clearInterval(cursorInterval);
          }, []);

          const typedCharacters = currentDisplay.split('');
          const nextCharacter = fullText[currentIndex];

          return (
            <span className="font-extrabold text-3xl">
              {typedCharacters.map((char, index) => (
                <span key={index}>{char}</span>
              ))}
              {!isDeleting && nextCharacter && (
                <span style={{ opacity: 0.5 }}>{nextCharacter}</span>
              )}
              <span className={`inline-block w-1 h-8 bg-gray-300 ml-1 typewriter-cursor ${showCursor ? 'opacity-100' : 'opacity-0'}`}>
                &nbsp;
              </span>
            </span>
          );
        };

            const uniqueCitiesWithCoordinates = Object.entries(cityCoordinates).map(([city, coordinates]) => ({

            const sanitizeLocationName = (name) => {
                return name.replace(/\s/g, '-').replace(/[.]/g, '');
            };

            const handleFilterClick = (locationName) => {

                return matchesLocation && matchesSearch;
            });
            
            // Effect to fetch the map data once
            useEffect(() => {
                const fetchMapData = async () => {
                    try {
                        // Using a more detailed world map
                        const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');
                        const data = await response.json();
                        setMapData(data);
                    } catch (error) {
                        console.error("Error fetching map data:", error);
                    }
                };
                fetchMapData();
            }, []);

            // Effect to handle D3.js map drawing and interaction
            useEffect(() => {
                if (!mapData || !mapRef.current) return;
                
                // Clear any existing map to prevent duplicates on re-render
                d3.select(mapRef.current).selectAll("*").remove();
                
                const container = mapRef.current.parentNode;
                const width = container.offsetWidth;
                const height = width / 2;

                const svg = d3.select(mapRef.current)
                    .attr("viewBox", `0 0 ${width} ${height}`)
                    .attr("preserveAspectRatio", "xMidYMid meet");

                // Initialize the projection
                const projection = d3.geoMercator()
                    .fitSize([width, height], topojson.feature(mapData, mapData.objects.countries));

                // Create a path generator
                const path = d3.geoPath().projection(projection);
                
                const countries = topojson.feature(mapData, mapData.objects.countries);
                
                // Main group for map elements to apply transformations
                const g = svg.append("g");
                
                // Draw the countries
                g.selectAll(".country-path")
                    .data(countries.features)
                    .enter().append("path")
                    .attr("class", d => `country-path country-${d.id}`)
                    .attr("d", path)
                    .on("click", (event, d) => {
                        const countryName = d.properties.name;
                        // For now, country clicks do not filter. The focus is on cities.
                        // You could add logic here to filter by country if desired.
                    });

                // Draw the pins
                const pins = g.selectAll(".pin")
                    .data(uniqueCitiesWithCoordinates)
                    .enter()
                    .append("circle")
                    .attr("class", d => `pin pin-${sanitizeLocationName(d.city)}`)
                    .attr("r", 4)
                    .attr("cx", d => projection(d.coordinates)[0])
                    .attr("cy", d => projection(d.coordinates)[1])
                    .on("click", function(event, d) {
                        handleFilterClick(d.city);
                        
                        if (activeLocation === d.city) {
                            // Zoom out to initial state if same city is clicked
                            svg.transition().duration(750).call(zoomRef.current.transform, d3.zoomIdentity);
                        } else {
                            // Zoom in to the new city
                            const [x, y] = projection(d.coordinates);
                            const scale = 4; // A good default zoom level
                            svg.transition().duration(750).call(
                                zoomRef.current.transform,
                                d3.zoomIdentity.translate(width / 2, height / 2).scale(scale).translate(-x, -y)
                            );
                        }
                    });

                // D3 Zoom Behavior for manual panning and zooming
                const zoom = d3.zoom()
                    .scaleExtent([1, 8]) // Limits the zoom from 1x to 8x

                        g.attr("transform", event.transform);
                        // Dynamic sizing for pins
                        g.selectAll(".pin").attr("r", 4 / event.transform.k);

            <div className="flex flex-col min-h-screen bg-amber-50 font-sans text-gray-800">
              {/* Wrapper for navigation and main content */}
              <div className="flex flex-1">
                {/* Vertical Navigation Bar */}
                <div className="w-64 p-4 sticky top-0 h-screen flex flex-col justify-center">
                  <nav>
                        <div className="flex-shrink-0 mb-8 md:mb-0">
                            <img
                                src="https://placehold.co/250x250/ADD8E6/000000?text=Your+Photo"
                                alt="Your Profile"
                                className="w-32 h-32 rounded-full object-cover border-4 border-amber-700 shadow-lg block mx-auto"
                                href="#" onClick={() => setCurrentPage('about')}
                            />
                        </div>
                        <div className="flex flex-wrap gap-8 mt-8"></div>
                    <div className="flex flex-col space-y-8 items-center">
                      <a href="#" onClick={() => setCurrentPage('about')} className="text-2xl font-bold text-amber-800 transition-colors">
                        Kaan Aytekin
                      </a>
                      <div className="flex flex-col space-y-2">
                        <NavItem href="about" isActive={currentPage === 'about'} onClick={setCurrentPage}>About</NavItem>
                        <NavItem href="projects" isActive={currentPage === 'projects' || currentPage === 'project-detail'} onClick={setCurrentPage}>Projects</NavItem>
                        <NavItem href="interests" isActive={currentPage === 'interests' || currentPage === 'photography-gallery'} onClick={setCurrentPage}>Interests</NavItem>
                        <NavItem href="contact" isActive={currentPage === 'contact'} onClick={setCurrentPage}>Contact</NavItem>
                      </div>
                    </div>
                  </nav>
                </div>

                {/* Main Content Area */}
                <div className="flex-1 overflow-y-auto flex flex-col">
                  {renderPage()}
                </div>
              </div>
              
              {/* Footer */}
              <footer className="bg-gradient-to-r from-gray-900 to-black text-white py-8 rounded-t-lg border-t-4 border-amber-700 shadow-lg">
                <div className="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-center md:text-left space-y-4 md:space-y-0">
                  <p className="text-sm">
                    &copy; {new Date().getFullYear()} [Your Name]. All rights reserved.
                  </p>
                  <div className="flex space-x-4">
                    <a href="#" onClick={() => setCurrentPage('projects')} className="text-amber-100 hover:text-white font-medium transition-colors duration-200">
                      Projects
                    </a>
                    <a href="#" onClick={() => setCurrentPage('interests')} className="text-amber-100 hover:text-white font-medium transition-colors duration-200">
                      Interests
                    </a>
                    <a href="#" onClick={() => setCurrentPage('contact')} className="text-amber-100 hover:text-white font-medium transition-colors duration-200">
                      Contact
                    </a>
                  </div>
                  <div className="text-sm text-amber-100 flex flex-col space-y-1">
                    <a href="mailto:kaanayt004@protonmail.com" className="hover:text-white transition-colors">
                      your.email@example.com
                    </a>
                    <a href="https://linkedin.com/in/kaan-aytekin" target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">
                      LinkedIn Profile
                    </a>
                  </div>
                </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
