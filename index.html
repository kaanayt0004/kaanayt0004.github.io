        // Typewriter Component for animated text with fading next letter and blinking cursor
        const Typewriter = ({ text, delay, infinite }) => {
          const [currentDisplay, setCurrentDisplay] = useState('');
          const [currentIndex, setCurrentIndex] = useState(0);
          const [isDeleting, setIsDeleting] = useState(false);
          const [loopNum, setLoopNum] = useState(0);
          const [showCursor, setShowCursor] = useState(true);

          const fullText = text[loopNum % text.length];

          useEffect(() => {
            let typingTimeout;
            const handleTyping = () => {
              if (!isDeleting) {
                if (currentIndex < fullText.length) {
                  setCurrentDisplay(fullText.substring(0, currentIndex + 1));
                  setCurrentIndex(prev => prev + 1);
                  typingTimeout = setTimeout(handleTyping, delay);
                } else {
                  if (!infinite) {
                    setShowCursor(false);
                    return;
                  }
                  typingTimeout = setTimeout(() => setIsDeleting(true), 1500);
                }
              } else {
                if (currentIndex > 0) {
                  setCurrentDisplay(fullText.substring(0, currentIndex - 1));
                  setCurrentIndex(prev => prev - 1);
                  typingTimeout = setTimeout(handleTyping, delay / 2);
                } else {
                  setIsDeleting(false);
                  setLoopNum(prev => prev + 1);
                  typingTimeout = setTimeout(handleTyping, 500);
                }
              }
            };
            typingTimeout = setTimeout(handleTyping, delay);
            return () => clearTimeout(typingTimeout);
          }, [currentIndex, isDeleting, loopNum, text, delay, infinite, fullText]);

          useEffect(() => {
            const cursorInterval = setInterval(() => {
              setShowCursor(prev => !prev);
            }, 500);
            return () => clearInterval(cursorInterval);
          }, []);

          const typedCharacters = currentDisplay.split('');
          const nextCharacter = fullText[currentIndex];

          return (
            <span className="font-extrabold text-3xl">
              {typedCharacters.map((char, index) => (
                <span key={index}>{char}</span>
              ))}
              {!isDeleting && nextCharacter && (
                <span style={{ opacity: 0.5 }}>{nextCharacter}</span>
              )}
              <span className={`inline-block w-1 h-8 bg-gray-300 ml-1 typewriter-cursor ${showCursor ? 'opacity-100' : 'opacity-0'}`}>
                &nbsp;
              </span>
            </span>
          );
        };

                      <div className="bg-white rounded-xl shadow-lg p-6 mb-8">
                        <div className="flex justify-between items-center mb-4 flex-wrap gap-4">
                          <h3 className="text-lg font-bold text-gray-800">Filter by Skill</h3>
                          <div className="flex space-x-2">
                              <button
                                onClick={() => setIsFilterExpanded(!isFilterExpanded)}
                                className="inline-flex items-center text-sm text-gray-500 hover:text-amber-800 transition-colors duration-200"
                              >
                                {isFilterExpanded ? 'Hide Filters' : 'Show Filters'}
                                <svg xmlns="http://www.w3.org/2000/svg" className={`h-4 w-4 ml-1 transform transition-transform duration-300 ${isFilterExpanded ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                  <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                              </button>
                              <button
                                onClick={() => setSelectedSkills([])}
                                className="text-sm text-gray-500 hover:text-red-600 transition-colors duration-200"
                              >
                                Clear Filters
                              </button>
                          </div>
                        </div>
                        
                        <div 
                          className={`grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 transition-all duration-300 ease-in-out ${isFilterExpanded ? 'max-h-96 opacity-100' : 'max-h-0 opacity-0 overflow-hidden'}`}
                        >
                          {allSkills.map(skill => (
                            <label key={skill} className="flex items-center space-x-2 cursor-pointer">
                              <input
                                type="checkbox"
                                checked={selectedSkills.includes(skill)}
                                onChange={() => handleSkillChange(skill)}
                                className="form-checkbox text-amber-600 rounded"
                              />
                              <span className="text-sm text-gray-700">{skill}</span>
                            </label>
                          ))}
                        </div>
                      </div>
                      
                      {/* Project Grid */}
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-8">
                        {filteredProjects.length > 0 ? (
                          filteredProjects.map((project, index) => (
                            <div key={index} className="bg-white rounded-xl shadow-lg overflow-hidden transition-transform duration-300 transform hover:scale-105">
                              <img 
                                src={project.image} 
                                alt={`${project.title} Project`} 
                                className="w-full h-auto object-contain" 
                              />
                              <div className="p-6">
                                <h3 className="text-xl font-bold text-gray-800 mb-2">{project.title}</h3>
                                <p className="text-gray-600 text-sm mb-4">{project.description}</p>
                                <div className="flex flex-wrap gap-2 mb-4">
                                  {project.tags.slice(0, 3).map((tag, tagIndex) => (
                                    <span key={tagIndex} className="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                                      {tag}
                                    </span>
                                  ))}
                                  {project.tags.length > 3 && (
                                    <span className="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                                      ...
                                    </span>
                                  )}
                                </div>
                                <button 
                                  onClick={() => handleProjectClick(project)}
                                  className="inline-block bg-amber-800 text-white font-bold py-2 px-4 rounded-lg hover:bg-amber-900 transition-all duration-300 transform hover:scale-105"
                                >
                                  View Project
                                </button>
                              </div>
                            </div>
                          ))
                        ) : (
                          <div className="col-span-full text-center py-10 text-gray-500">
                            No projects match the selected skills.
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              case 'interests':
                return <InterestsPage setCurrentPage={setCurrentPage}/>;
              case 'photography-gallery':
                return <PhotographyGalleryPage onBack={handleBackToInterests} />;
              case 'contact':
                return (
                  <div className="py-20 px-4 flex-1">
                    <div className="container mx-auto max-w-4xl">
                      <h2 className="text-4xl font-bold text-center text-amber-800 mb-10">Get in Touch</h2>
                      
                      <div className="bg-white rounded-xl shadow-lg p-8 md:p-12">
                        <div className="text-center mb-10">
                          <p className="text-lg text-gray-700 leading-relaxed mb-6">
                            I am currently completing my senior year and am <b>open to full-time Mechanical Engineering opportunities starting May 2026</b>.
                          </p>

                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                          {/* Email Card */}
                          <a 
                            href="mailto:kaanayt004@protonmail.com"
                            className="flex flex-col items-center p-6 bg-amber-50 rounded-lg border border-amber-100 hover:border-amber-300 hover:shadow-md transition-all duration-300 group"
                          >
                            <div className="w-12 h-12 bg-amber-200 text-amber-800 rounded-full flex items-center justify-center mb-4 group-hover:bg-amber-800 group-hover:text-white transition-colors duration-300">
                              <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                              </svg>
                            </div>
                            <h3 className="font-bold text-gray-800 mb-1">Email</h3>
                            <span className="text-sm text-gray-600 break-all">kaanayt004@protonmail.com</span>
                          </a>

                          {/* LinkedIn Card */}
                          <a 
                            href="https://linkedin.com/in/kaan-aytekin" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="flex flex-col items-center p-6 bg-amber-50 rounded-lg border border-amber-100 hover:border-amber-300 hover:shadow-md transition-all duration-300 group"
                          >
                            <div className="w-12 h-12 bg-amber-200 text-amber-800 rounded-full flex items-center justify-center mb-4 group-hover:bg-amber-800 group-hover:text-white transition-colors duration-300">
                              <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                              </svg>
                            </div>
                            <h3 className="font-bold text-gray-800 mb-1">LinkedIn</h3>
                            <span className="text-sm text-gray-600">Connect with me</span>
                          </a>

                          {/* Call Card */}
                          <a 
                            href="tel:+15852025147" // Replace with your actual phone number
                            className="flex flex-col items-center p-6 bg-amber-50 rounded-lg border border-amber-100 hover:border-amber-300 hover:shadow-md transition-all duration-300 group"
                          >
                            <div className="w-12 h-12 bg-amber-200 text-amber-800 rounded-full flex items-center justify-center mb-4 group-hover:bg-amber-800 group-hover:text-white transition-colors duration-300">
                              <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                <path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                              </svg>
                            </div>
                            <h3 className="font-bold text-gray-800 mb-1">Call</h3>
                            <span className="text-sm text-gray-600">+1 (585) 202-5147</span>
                          </a>
                        </div>
                        
                        <div className="border-t border-gray-200 pt-8 text-center">
                             <p className="text-gray-600 mb-4">You can also download my resume to keep on file.</p>
                             <a 
                                href="resume.pdf" 
                                download="resume.pdf"
                                className="inline-block bg-amber-800 text-white font-bold py-2 px-6 rounded-lg hover:bg-amber-900 transition-all duration-300 transform hover:scale-105 shadow-md"
                              >
                                Download Resume
                              </a>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              default:
                return null;
            }
          };

          return (
            <div className="flex flex-col min-h-screen bg-amber-50 font-sans text-gray-800">
              
              {/* === YENİ MOBİL NAVİGASYON === */}
              <MobileNav 
                currentPage={currentPage}
                setCurrentPage={setCurrentPage}
                isMobileMenuOpen={isMobileMenuOpen}
                setIsMobileMenuOpen={setIsMobileMenuOpen}
              />

              {/* Wrapper for navigation and main content */}
              <div className="flex flex-1">
                
                {/* === GÜNCELLENDİ: Vertical Navigation Bar (Masaüstü için) === */}
                {/* "hidden" (mobilde gizli) ve "md:flex" (orta ekran ve üstünde görünür) eklendi */}
                <div className="hidden md:flex w-64 p-4 sticky top-0 h-screen flex-col justify-center">
                  <nav>
                        <div className="flex-shrink-0 mb-8 md:mb-0">
                            <img
                                src="https://github.com/kaanayt0004/kaanayt0004.github.io/blob/main/OnePagers/Headshot.jpg?raw=true"
                                alt="Your Profile"
                                className="w-32 h-32 rounded-full object-cover border-4 border-amber-700 shadow-lg block mx-auto"
                                href="#" onClick={() => setCurrentPage('about')}
                            />
                        </div>
                        <div className="flex flex-wrap gap-8 mt-8"></div>
                    <div className="flex flex-col space-y-8 items-center">
                      <a href="#" onClick={() => setCurrentPage('about')} className="text-2xl font-bold text-amber-800 transition-colors">
                        Kaan Aytekin
                      </a>
                      <div className="flex flex-col space-y-2">
                        <NavItem href="about" isActive={currentPage === 'about'} onClick={setCurrentPage}>About</NavItem>
                        <NavItem href="projects" isActive={currentPage === 'projects' || currentPage === 'project-detail'} onClick={setCurrentPage}>Projects</NavItem>
                        <NavItem href="interests" isActive={currentPage === 'interests' || currentPage === 'photography-gallery'} onClick={setCurrentPage}>Interests</NavItem>
                        <NavItem href="contact" isActive={currentPage === 'contact'} onClick={setCurrentPage}>Contact</NavItem>
                        <a
                          href="resume.pdf"
                          download="resume.pdf"
                          onClick={() => setIsMobileMenuOpen(false)} // Menüyü kapat
                          className="font-bold px-3 py-2 transition-all duration-300 transform hover:scale-110 text-gray-500 hover:text-amber-800"
                        >
                          Download Resume
                        </a>
                      </div>
                    </div>
                  </nav>
                </div>

                {/* === GÜNCELLENDİ: Main Content Area === */}
                {/* Mobilde sabit menü için "pt-20" (padding-top) eklendi, masaüstünde "md:pt-0" ile sıfırlandı */}
                <div className="flex-1 overflow-y-auto flex flex-col pt-20 md:pt-0">
                  {renderPage()}
                </div>
              </div>
              
              {/* Footer */}
              <footer className="bg-gradient-to-r from-gray-900 to-black text-white py-8 rounded-t-lg border-t-4 border-amber-700 shadow-lg">
                <div className="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-center md:text-left space-y-4 md:space-y-0">
                  <p className="text-sm">
                    &copy; {new Date().getFullYear()} Kaan Aytekin. All rights reserved.
                  </p>
                  <div className="flex space-x-4">
                    <a href="#" onClick={() => setCurrentPage('projects')} className="text-amber-100 hover:text-white font-medium transition-colors duration-200">
                      Projects
                    </a>
                    <a href="#" onClick={() => setCurrentPage('interests')} className="text-amber-100 hover:text-white font-medium transition-colors duration-200">
                      Interests
                    </a>
                    <a href="#" onClick={() => setCurrentPage('contact')} className="text-amber-100 hover:text-white font-medium transition-colors duration-200">
                      Contact
                    </a>
                  </div>
                  <div className="text-sm text-amber-100 flex flex-col space-y-1">
                    <a href="mailto:kaanayt004@protonmail.com" className="hover:text-white transition-colors">
                      kaanayt004@protonmail.com
                    </a>
                    <a href="https://linkedin.com/in/kaan-aytekin" target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">
                      LinkedIn Profile
                    </a>
                  </div>
                </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>

</body>
</html>
